<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="IMG/ICON-ADOBE-ADMINISTRACION.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="../CSS/header.css">
        <link rel="stylesheet" href="../CSS/contenido-contacto.css">
        <link rel="stylesheet" href="../CSS/footer.css">
        <title>Adobe Administración | Administración Inmobiliaria</title>
        <style>
            /* Encabezados con Playfair Display */
            h1, h2, h3 {
                font-family: 'Playfair Display', serif !important;
            }
        
            /* Texto del cuerpo con Roboto */
            p, span, li {
                font-family: 'Roboto', sans-serif !important;
            }
        
            /* Textos destacados o botones con Lato */
            button, .highlight {
                font-family: 'Lato', sans-serif !important;
            }
        </style>
    </head>

    <body>
        <div id="headers"></div>

        <main>
            <section class="introduction">
                <div class="carousel">
                    <div class="carousel-container">
                        <div class="carousel-slide">
                            <img src="../IMG/carousel/1.png"
                                alt="Vista aérea de edificios por parte de Adobe Administración">
                            <img src="../IMG/carousel/2.png"
                                alt="Foto de una casa colorida por parte de Adobe Administración">
                            <img src="../IMG/carousel/3.png"
                                alt="Vista de un edificio con muchas ventanas por parte de Adobe Administración">
                            <img src="../IMG/carousel/4.png"
                                alt="Foto de una casa blanca con estilo moderno por parte de Adobe Administración">
                            <img src="../IMG/carousel/5.png"
                                alt="Vista de la calle con 3 edificios por parte de Adobe Administración">
                            <img src="../IMG/carousel/6.png"
                                alt="Imagen de una persona sosteniendo una casa de juguete en sus manos por parte de Adobe Administración">
                            <img src="../IMG/carousel/7.png"
                                alt="Foto de la estructura de una casa de madera por parte de Adobe Administración">
                            <img src="../IMG/carousel/8.png"
                                alt="Vista de un edificio residencial por parte de Adobe Administración">
                        </div>
                    </div>
                </div>

                <div class="nombre">
                    <h1>Adobe Administración</h1>
                </div>
            </section>

            <section class="contacto">
                <div class="form-container">
                    <h1>Contáctanos</h1>
                    <form id="contactForm">
                        <input type="text" id="name" placeholder="Tu Nombre" required>
                        <input type="email" id="email" placeholder="Tu Correo" required>
                        <textarea id="message" placeholder="Tu Mensaje" rows="5" required></textarea>
                        <button type="submit">Enviar</button>
                    </form>
                    <p id="responseMessage" style="text-align: center; color: green;"></p>
                </div>
            </section>
        </main>

        <div id="footers"></div>

        <script type="module" src="../JS/main.js"></script>
        <script type="module" src="../JS/contacto.js"></script>
    </body>
</html>
