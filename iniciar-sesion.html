<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../CSS/header.css">
        <link rel="stylesheet" href="../CSS/contenido-iniciar-sesion.css">
        <link rel="stylesheet" href="../CSS/footer.css">
        <title>Adobe Admon | Iniciar Sesion</title>
    </head>

    <body>
        <div id="headers"></div>

        <main>
            <section class="introduction">
                <div class="carousel">
                    <div class="carousel-container">
                        <div class="carousel-slide">
                            <img src="../IMG/carousel/1.png"
                                alt="Vista aérea de edificios por parte de Adobe Admon">
                            <img src="../IMG/carousel/2.png"
                                alt="Foto de una casa colorida por parte de Adobe Admon">
                            <img src="../IMG/carousel/3.png"
                                alt="Vista de un edificio con muchas ventanas por parte de Adobe Admon">
                            <img src="../IMG/carousel/4.png"
                                alt="Foto de una casa blanca con estilo moderno por parte de Adobe Admon">
                            <img src="../IMG/carousel/5.png"
                                alt="Vista de la calle con 3 edificios por parte de Adobe Admon">
                            <img src="../IMG/carousel/6.png"
                                alt="Imagen de una persona sosteniendo una casa de juguete en sus manos por parte de Adobe Admon">
                            <img src="../IMG/carousel/7.png"
                                alt="Foto de la estructura de una casa de madera por parte de Adobe Admon">
                            <img src="../IMG/carousel/8.png"
                                alt="Vista de un edificio residencial por parte de Adobe Admon">
                        </div>
                    </div>
                </div>

                <div class="nombre">
                    <h1>Adobe Admon</h1>
                </div>
            </section>

            <section class="iniciar-sesion">
                <div class="login-container">
                    <form class="login-form" id="loginForm">
                        <h2>Iniciar sesión</h2>
                        <div class="input-group">
                            <input type="text" id="username" placeholder="Nombre de usuario" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="password" placeholder="Contraseña" required>
                        </div>
                        <button type="submit" class="btn-login">Iniciar sesión</button>
                        <p class="message">¿No tienes cuenta? <a href="#">Regístrate</a></p>
                    </form>
            </section>
        </main>

        <div id="footers"></div>

        <script type="module" src="../JS/main.js"></script>
        <script type="module" src="../JS/contenido-content.js"></script>
    </body>
</html>
